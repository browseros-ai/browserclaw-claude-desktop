name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      # Third-party and first-party actions are pinned to immutable commit
      # SHAs (not tags) so a supply-chain compromise of the upstream repo
      # cannot silently change what runs at release time. Comments record
      # the human-readable version each SHA represents; Dependabot can
      # bump these in place.

      - name: Check out repo at tag
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Verify R2 configuration
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          missing=()
          for name in R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done
          if ((${#missing[@]})); then
            echo "::error::Missing required R2 secrets: ${missing[*]}"
            exit 1
          fi

      - name: Install AWS CLI
        run: |
          python3 -m pip install --user awscli
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify tag matches manifest.json version
        # Tag must equal "v" + manifest.json's `version`. Catches the
        # common mistake of tagging without bumping the manifest, which
        # would produce an archive named after the manifest version
        # rather than the tag and confuse Claude Desktop's update flow.
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          MANIFEST_VERSION=$(jq -r '.version' manifest.json)
          if [ "$TAG_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} (version ${TAG_VERSION}) does not match manifest.json version ${MANIFEST_VERSION}. Bump manifest.json and re-tag."
            exit 1
          fi
          echo "Tag and manifest agree on ${MANIFEST_VERSION}."

      - name: Install production dependencies and pack .mcpb
        run: ./scripts/pack-mcpb.sh

      - name: Confirm archive exists
        run: |
          set -euo pipefail
          VERSION=$(jq -r '.version' manifest.json)
          ARCHIVE="build/browserclaw-${VERSION}.mcpb"
          if [ ! -f "${ARCHIVE}" ]; then
            echo "::error::Expected archive ${ARCHIVE} not found."
            exit 1
          fi
          SIZE=$(du -h "${ARCHIVE}" | cut -f1)
          echo "Built ${ARCHIVE} (${SIZE})."

      - name: Upload immutable archive to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_EC2_METADATA_DISABLED: 'true'
          AWS_PAGER: ''
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          version=$(jq -r '.version' manifest.json)
          archive="build/browserclaw-${version}.mcpb"
          key="artifacts/browserclaw-claude-desktop/${version}/browserclaw-${version}.mcpb"
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          release_sha=$(git rev-parse HEAD)
          sha256=$(sha256sum "$archive" | cut -d ' ' -f1)
          size=$(wc -c < "$archive" | tr -d '[:space:]')
          disposition="attachment; filename=\"browserclaw-${version}.mcpb\""
          metadata_path="$RUNNER_TEMP/browserclaw-r2-head.json"

          if ! aws s3api head-object \
            --endpoint-url "$endpoint" \
            --region auto \
            --bucket "$R2_BUCKET" \
            --key "$key" > "$metadata_path" 2>/dev/null; then
            if ! aws s3api put-object \
              --endpoint-url "$endpoint" \
              --region auto \
              --bucket "$R2_BUCKET" \
              --key "$key" \
              --body "$archive" \
              --content-type application/zip \
              --content-disposition "$disposition" \
              --metadata "component=artifacts/browserclaw-claude-desktop,target=universal,version=${version},release-sha=${release_sha},sha256=${sha256}" \
              --if-none-match '*' >/dev/null; then
              echo "Immutable upload did not complete; checking for a matching object."
            fi
            aws s3api head-object \
              --endpoint-url "$endpoint" \
              --region auto \
              --bucket "$R2_BUCKET" \
              --key "$key" > "$metadata_path"
          fi

          if ! jq -e \
            --arg component 'artifacts/browserclaw-claude-desktop' \
            --arg disposition "$disposition" \
            --arg release_sha "$release_sha" \
            --arg sha256 "$sha256" \
            --arg version "$version" \
            --argjson size "$size" \
            '.ContentLength == $size and .ContentType == "application/zip" and .ContentDisposition == $disposition and .Metadata.component == $component and .Metadata.target == "universal" and .Metadata.version == $version and .Metadata["release-sha"] == $release_sha and .Metadata.sha256 == $sha256' \
            "$metadata_path" >/dev/null; then
            echo "::error::Immutable R2 object does not match ${archive}: ${key}"
            exit 1
          fi

          canonical="$RUNNER_TEMP/browserclaw-r2-${version}.mcpb"
          aws s3api get-object \
            --endpoint-url "$endpoint" \
            --region auto \
            --bucket "$R2_BUCKET" \
            --key "$key" \
            "$canonical" >/dev/null
          canonical_sha=$(sha256sum "$canonical" | cut -d ' ' -f1)
          if [ "$canonical_sha" != "$sha256" ]; then
            echo "::error::Immutable R2 object content does not match ${archive}: ${key}"
            exit 1
          fi

          {
            echo '### BrowserClaw Claude Desktop R2 publish'
            echo
            echo "- Versioned: \`https://cdn.browseros.com/${key}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create GitHub Release and upload archive
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: build/browserclaw-*.mcpb
          fail_on_unmatched_files: true
          generate_release_notes: true
          # Mark prereleases when the tag has a -suffix (e.g. v0.1.0-rc.1)
          # so users on the stable channel are not nudged to install them.
          prerelease: ${{ contains(github.ref_name, '-') }}

      - name: Promote stable archive to latest on R2
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_EC2_METADATA_DISABLED: 'true'
          AWS_PAGER: ''
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          version=$(jq -r '.version' manifest.json)
          source="artifacts/browserclaw-claude-desktop/${version}/browserclaw-${version}.mcpb"
          destination='artifacts/browserclaw-claude-desktop/latest/browserclaw.mcpb'
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          release_sha=$(git rev-parse HEAD)
          sha256=$(sha256sum "build/browserclaw-${version}.mcpb" | cut -d ' ' -f1)
          size=$(wc -c < "build/browserclaw-${version}.mcpb" | tr -d '[:space:]')
          disposition="attachment; filename=\"browserclaw-${version}.mcpb\""

          aws s3api copy-object \
            --endpoint-url "$endpoint" \
            --region auto \
            --bucket "$R2_BUCKET" \
            --copy-source "${R2_BUCKET}/${source}" \
            --metadata-directive COPY \
            --key "$destination" >/dev/null

          metadata_path="$RUNNER_TEMP/browserclaw-r2-latest-head.json"
          aws s3api head-object \
            --endpoint-url "$endpoint" \
            --region auto \
            --bucket "$R2_BUCKET" \
            --key "$destination" > "$metadata_path"
          if ! jq -e \
            --arg component 'artifacts/browserclaw-claude-desktop' \
            --arg disposition "$disposition" \
            --arg release_sha "$release_sha" \
            --arg sha256 "$sha256" \
            --arg version "$version" \
            --argjson size "$size" \
            '.ContentLength == $size and .ContentType == "application/zip" and .ContentDisposition == $disposition and .Metadata.component == $component and .Metadata.target == "universal" and .Metadata.version == $version and .Metadata["release-sha"] == $release_sha and .Metadata.sha256 == $sha256' \
            "$metadata_path" >/dev/null; then
            echo "::error::Latest R2 object does not match ${source}: ${destination}"
            exit 1
          fi

          echo "- Latest: \`https://cdn.browseros.com/${destination}\`" >> "$GITHUB_STEP_SUMMARY"
